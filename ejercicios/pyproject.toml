[project]
name = "gemela"
version = "0.1.0"
description = "App MCP gemela de un sitio web para ChatGPT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "itsdangerous>=2.2,<3",
  "beautifulsoup4>=4.12,<5",
  "openai>=1.60,<3",
  "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
