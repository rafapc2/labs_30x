services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gemela
      POSTGRES_PASSWORD: gemela
      POSTGRES_DB: gemela
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemela -d gemela"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: sh -c "python -m gemela.db && uvicorn gemela.web:app --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gemela:gemela@postgres:5432/gemela
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Único servicio que se expone por el túnel (ADR 0002).
  mcp:
    build: .
    command: uvicorn gemela.servidor_mcp:app --host 0.0.0.0 --port 8001
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gemela:gemela@postgres:5432/gemela
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  datos:
