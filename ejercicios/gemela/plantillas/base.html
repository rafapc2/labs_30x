<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}App MCP gemela{% endblock %}</title>
<style>
  :root { --fondo:#fafaf7; --texto:#1c1c1a; --suave:#6b6b66; --borde:#dcdcd4; --acento:#1d4ed8; --error:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#141413; --texto:#ecece8; --suave:#9a9a94; --borde:#33332f; --acento:#7aa2ff; --error:#ff8a80; --ok:#5fd39b; } }
  body { margin:0; background:var(--fondo); color:var(--texto); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:24px; }
  h1 { font-size:1.4rem; margin:0; } h2 { font-size:1.1rem; margin:28px 0 8px; }
  a { color:var(--acento); } .suave { color:var(--suave); }
  input[type=url], textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid var(--borde); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  button, .boton { padding:9px 14px; border:1px solid var(--borde); border-radius:8px; background:transparent; color:inherit; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  button.primario { background:var(--acento); border-color:var(--acento); color:#fff; }
  .error { color:var(--error); margin:6px 0 0; } .ok { color:var(--ok); }
  .tarjeta { border:1px solid var(--borde); border-radius:10px; padding:14px 16px; margin:10px 0; }
  code, pre { background:rgba(127,127,127,.15); border-radius:6px; padding:2px 6px; font-size:.9em; } pre { padding:10px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
  .chat { max-height:320px; overflow-y:auto; } .msg { margin:8px 0; } .msg b { display:block; font-size:.8rem; color:var(--suave); }
  table { border-collapse:collapse; width:100%; } td, th { border-bottom:1px solid var(--borde); padding:6px 8px; text-align:left; }
</style>
</head>
<body>
<main>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">App MCP gemela</a></h1>
  {% if usuario %}<form method="post" action="/auth/logout-web" style="margin:0"><span class="suave">{{ usuario.nombre }}</span> <button>Salir</button></form>{% endif %}
</header>
{% block contenido %}{% endblock %}
</main>
</body>
</html>
